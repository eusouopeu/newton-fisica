<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f8560"/>
      <stop offset="100%" stop-color="#26543d"/>
    </linearGradient>
    <linearGradient id="apple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="55%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#a91f1f"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#82bf95"/>
      <stop offset="100%" stop-color="#3f8560"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- stem -->
  <path d="M512 300 C 500 260, 512 210, 552 178" stroke="#603e23" stroke-width="26" stroke-linecap="round" fill="none"/>

  <!-- leaf -->
  <path d="M552 210 C 620 190, 672 220, 682 268 C 624 282, 566 264, 552 210 Z" fill="url(#leaf)"/>

  <!-- apple body -->
  <path d="M512 340
           C 400 340, 300 430, 300 570
           C 300 700, 390 800, 480 830
           C 500 838, 524 838, 544 830
           C 634 800, 724 700, 724 570
           C 724 435, 630 340, 526 340
           C 520 340, 516 340, 512 340 Z"
        fill="url(#apple)"/>

  <!-- shine highlight -->
  <path d="M400 460 C 400 420, 440 390, 480 396 C 440 420, 420 460, 424 520 C 400 505, 396 480, 400 460 Z"
        fill="#ffffff" opacity="0.35"/>
</svg>
